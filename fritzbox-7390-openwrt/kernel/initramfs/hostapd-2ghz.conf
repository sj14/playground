# Test network for bring-up. It only exists for the few minutes of a test run
# and has no connection to anything else, so the password is not a secret.
interface=wlan1
driver=nl80211
ssid=fritzbox7390-test-2ghz
country_code=DE
hw_mode=g
channel=6
ieee80211n=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=only-for-testing-7390
