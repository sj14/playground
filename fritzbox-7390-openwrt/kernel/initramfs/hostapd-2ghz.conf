# Test network for bring-up. The build replaces @PASSWORD@ with a random password,
# because this network is connected to the home network.
interface=wlan1
bridge=br0
driver=nl80211
ssid=fritzbox7390-test-2ghz
country_code=DE
hw_mode=g
channel=6
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-40]
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=@PASSWORD@
