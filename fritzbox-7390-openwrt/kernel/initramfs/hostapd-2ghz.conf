# Test network for bring-up. The build replaces @PASSWORD@ with a random password,
# because this network gives access to a root shell on the box.
interface=wlan1
driver=nl80211
ssid=fritzbox7390-test-2ghz
country_code=DE
hw_mode=g
channel=6
ieee80211n=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=@PASSWORD@
